workflows:
  ios-tweak-build:
    name: EeveeSpotifyReincarnated Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        THEOS: $HOME/theos
    scripts:
      - name: Install Dependencies
        script: |
          brew install make dpkg ldid

      - name: Setup Theos & SDKs
        script: |
          git clone --recursive https://github.com/theos/theos.git $THEOS
          curl -LO https://github.com/theos/sdks/archive/master.zip
          unzip -q master.zip
          mkdir -p $THEOS/sdks
          mv sdks-master/*.sdk $THEOS/sdks/

      - name: Build EeveeSwiftProtobuf Framework
        script: |
          chmod +x Tools/SwiftProtobufBuild/build-eeveeswiftprotobuf.sh
          ./Tools/SwiftProtobufBuild/build-eeveeswiftprotobuf.sh
          mkdir -p "$THEOS/lib/iphone/rootless"
          # Lo script dovrebbe posizionare il framework automaticamente.
          # Se fallisce, cerca il framework compilato e copialo manualmente.
          if [ ! -d "$THEOS/lib/iphone/rootless/EeveeSwiftProtobuf.framework" ]; then
            echo "Framework non trovato nella posizione standard. Cerco..."
            find . -type d -name 'EeveeSwiftProtobuf.framework' -exec cp -r {} "$THEOS/lib/iphone/rootless/" \;
          fi

      - name: Build Tweak
        script: |
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

    artifacts:
      - "packages/*.deb"
