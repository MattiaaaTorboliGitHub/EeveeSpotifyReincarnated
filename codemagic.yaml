workflows:
  ios-tweak-build:
    name: EeveeSpotifyReincarnated Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        THEOS: $HOME/theos
    scripts:
      - name: Install Dependencies
        script: |
          brew install make dpkg ldid
      - name: Setup Theos
        script: |
          git clone --recursive https://github.com/theos/theos.git $THEOS
      - name: Copy SwiftProtobuf Framework
        script: |
          make copy-swiftprotobuf
      - name: Build Tweak
        script: |
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
    artifacts:
      - "packages/*.deb"
